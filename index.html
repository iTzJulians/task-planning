<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task-planning</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="js/index.js"></script>

</head>

<body class="d-flex flex-column h-100">

    <header class="w-100 d-flex flex-row justify-content-start align-items-center px-5 py-3 text-light header">
        <h1 class="fs-2 fw-bolder text-light">
            Planeador de tareas
        </h1>
    </header>
    <main class="w-100 p-4">
        <section class=" w-100 h-100 bg-body rounded-4 shadow d-flex flex-column p-4 task-div">
            <div class="d-flex flex-row justify-content-between align-items-center mb-3">
                <h2 class="h2 fs-3 fw-bolder">
                    Lista de tareas
                </h2>

                <button class="button py-2 px-5 rounded-3 text-light fw-bold" id="addTask">
                    Nueva tarea
                </button>
            </div>
            <div class="task-container w-100 rounded-3 p-2 d-flex flex-column gap-2">
                <!-- tarea -->
            </div>

        </section>
    </main>
    <div class="backdrop d-flex justify-content-center align-items-center d-none" id="modal">
        <form class="bg-light p-3 rounded-4 d-flex flex-column align-items-center justify-content-start modalForm"
            novalidate id="taskForm">
            <button class="px-3 align-self-end w-auto border border-0 bg-transparent fw-normal fs-4" id="closeModal"
                type="button">x</button>
            <div class=" d-flex flex-column gap-4 align-items-center justify-content-center px-5 w-100 ">
                <h1>
                    Tarea
                </h1>
                <div class="d-flex flex-column gap-1 w-100">
                    <label for="">
                        Nombre de la tarea
                    </label>
                    <input type="text" name="Nombre de la tarea" id="nameInput" class="">
                </div>
                <div class="d-flex flex-column gap-1 w-100">
                    <label for="">
                        Descripcion de la tarea
                    </label>
                    <textarea rows="4" name="Descripcion de la tarea" style="resize: none;" id="description"
                        class=""></textarea>
                </div>

                <div class="d-flex flex-column gap-1 w-100">
                    <label for="">
                        Categoria
                    </label>
                    <select name="Categoria" id="categoryInput" class="">
                        <option value="" selected disabled>Selecciona una opcion</option>
                        <option value="Estudio">Estudio</option>
                        <option value="Trabajo">Trabajo</option>
                        <option value="Personal">Personal</option>
                        <option value="Familiar">Familiar</option>
                    </select>
                </div>

                <div class="d-flex flex-column gap-1 w-100">
                    <label for="">
                        Fecha limite
                    </label>
                    <input type="date" name="Fecha" id="dateInput" class="">
                    </select>
                </div>


                <button class="w-50 py-2 rounded-3 border-0 btn-form fw-bolder " type="submit" class="">
                    Añadir
                </button>
            </div>

        </form>
    </div>
</body>

</html>
